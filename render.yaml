services:
  - type: web
    name: trawis-website
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: trawis2026
      - key: NOTIFICATION_EMAIL
        value: sales@bluwis.com
